name: CI

on:
  pull_request:
  push:
    branches: [main, 'feature/**']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Unit and regression tests (Vitest)
        run: npm test
      - name: Production build
        run: npm run build
      - name: Integration suite (dev server, file-backed store)
        run: |
          NODE_ENV=development PORT=3000 npx tsx server.ts > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3000/api/health && break || sleep 1; done
          npm run test:verify
      - name: Production-hardening checks
        run: npx tsx scripts/test-prod-hardening.ts
      - name: Dependency audit (production + dev)
        run: npm audit --audit-level=high
