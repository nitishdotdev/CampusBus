services:
  - type: web
    name: campusbus-api
    runtime: node
    plan: starter

    # Install deps, compile the PostgreSQL-backed Express server, apply non-destructive schema
    buildCommand: npm ci && npm run build && npm run db:migrate

    # Run the compiled PostgreSQL-backed server
    startCommand: npm run start

    # Render marks the service healthy when this returns 200
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      # Neon / PostgreSQL connection string — set in the Render dashboard
      - key: DATABASE_URL
        sync: false

      - key: JWT_SECRET
        sync: false

      # Temporary; remove after the first admin is created via POST /api/auth/bootstrap-admin
      - key: BOOTSTRAP_SECRET
        sync: false

      # Set to the Vercel frontend origin (https, no trailing slash)
      - key: CORS_ORIGIN
        sync: false
