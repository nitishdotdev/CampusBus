services:
  - type: web
    name: campusmove-api
    runtime: node
    plan: starter

    # Install deps + compile the apps/api bundle
    buildCommand: npm ci && npm run api:build

    # Run the compiled bundle
    startCommand: npm run api:start

    # Render marks the service healthy when this returns 200
    healthCheckPath: /healthz

    envVars:
      - key: NODE_ENV
        value: production

      # Neon PostgreSQL connection string — mark as secret in the Render dashboard
      - key: DATABASE_URL
        sync: false

      - key: ACCESS_TOKEN_SECRET
        sync: false

      - key: REFRESH_TOKEN_SECRET
        sync: false

      # One-time campus + first-admin bootstrap. Blank after initial setup.
      - key: BOOTSTRAP_SECRET
        sync: false

      # Must match the actual Vercel production origin (no trailing slash).
      - key: CORS_ORIGIN
        value: https://campus-move-one.vercel.app

      # Optional SMTP email delivery
      # - key: SMTP_HOST
      #   sync: false
      # - key: SMTP_PORT
      #   value: 587
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASS
      #   sync: false
      # - key: EMAIL_FROM
      #   value: noreply@yourcampus.edu
