services:
  - type: web
    name: campusbus-api
    runtime: node
    plan: starter

    # Install deps + compile the apps/api bundle
    buildCommand: npm ci && npm run api:build

    # Run the compiled bundle
    startCommand: npm run api:start

    # Render marks the service healthy when this returns 200
    healthCheckPath: /healthz

    envVars:
      - key: NODE_ENV
        value: production

      # Set in the Render dashboard — do not commit actual values
      - key: MONGODB_URI
        sync: false

      - key: ACCESS_TOKEN_SECRET
        sync: false

      - key: REFRESH_TOKEN_SECRET
        sync: false

      # Remove or blank after first campus record is created
      - key: BOOTSTRAP_SECRET
        sync: false

      # Set to the Vercel frontend origin (https, no trailing slash)
      - key: CORS_ORIGIN
        sync: false

      # Optional SMTP email delivery
      # - key: SMTP_HOST
      #   sync: false
      # - key: SMTP_PORT
      #   value: 587
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASS
      #   sync: false
      # - key: EMAIL_FROM
      #   sync: false
