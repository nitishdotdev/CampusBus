services:
  - type: web
    name: campusmove-backend
    env: node
    plan: starter
    buildCommand: npm install && npm run build && npm run db:migrate
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campusmove-db
          property: connectionString
      - key: DATABASE_SSL_MODE
        value: encrypt-private # fromDatabase resolves Render's INTERNAL URL: TLS is optional there and uses self-signed certificates, so verification cannot apply.
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false # Must be set to your Vercel frontend URL, e.g. https://campusmove.vercel.app

databases:
  - name: campusmove-db
    plan: free
    databaseName: campusmove
    user: campus_admin
